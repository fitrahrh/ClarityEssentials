# ========================================================
# 🌟 ClarityEssentials Configuration
# Core plugin custom-built for Clarity Network
# ========================================================

# Chat formatting settings
chat:
  enabled: true
  
  # Default chat format when no group format matches
  # Variables available:
  # {prefix}    - LuckPerms prefix (or empty)
  # {suffix}    - LuckPerms suffix (or empty)
  # {player}    - Player original Minecraft username
  # {nickname}  - Player nickname if set, otherwise username
  # {message}   - The chat message
  # PlaceholderAPI is supported (e.g. %player_ping%, %vault_eco_balance%, etc.)
  default-format: "<gray>{prefix}</gray><white>{nickname}</white><gray>{suffix}</gray><dark_gray> » </dark_gray><white>{message}</white>"
  
  # Group-specific chat formats (matched against player's primary LuckPerms group)
  # Group names must be lowercase.
  group-formats:
    owner: "<dark_red><bold>[Owner]</bold></dark_red> <gradient:#ff5555:#ffaa00><bold>{nickname}</bold></gradient><dark_gray> » </dark_gray><white>{message}</white>"
    admin: "<red><bold>[Admin]</bold></red> <red>{nickname}</red><dark_gray> » </dark_gray><white>{message}</white>"
    mod: "<dark_purple><bold>[Mod]</bold></dark_purple> <light_purple>{nickname}</light_purple><dark_gray> » </dark_gray><white>{message}</white>"
    vip: "<gold>[VIP]</gold> <yellow>{nickname}</yellow><dark_gray> » </dark_gray><white>{message}</white>"
    mvp: "<aqua><bold>[MVP]</bold></aqua> <aqua>{nickname}</aqua><dark_gray> » </dark_gray><white>{message}</white>"
    default: "<gray>[Member]</gray> <white>{nickname}</white><dark_gray> » </dark_gray><gray>{message}</gray>"

  # Permission required to use MiniMessage tags & color codes in chat messages
  color-permission: "clarityessentials.chat.color"

# Nickname system settings (/nick, /realname)
nickname:
  enabled: true
  
  # Regex to strictly validate allowed characters in nicknames
  # Note: Color tags (e.g. <green>, <#ff0000>) are stripped before regex testing
  allowed-nicks-regex: "^[a-zA-Z0-9_]{3,16}$"
  
  # Length boundaries
  min-length: 3
  max-length: 16
  
  # Update player tablist name alongside display name
  change-tab-name: true
  
  # Permission to bypass regex and length limits
  unsafe-bypass-permission: "clarityessentials.nick.allowunsafe"
  
  # Permission to use color tags in nickname
  color-permission: "clarityessentials.nick.color"

# Teleportation system settings (/tpa, /tpahere, /tpaccept, /tpdeny, /tptoggle)
teleport:
  # Timeout duration for teleport requests in seconds
  timeout-seconds: 60
  
  # Warmup delay before teleporting (in seconds). 0 to disable.
  warmup-seconds: 3
  
  # Cancel teleport warmup if the player moves
  cancel-on-move: true
  
  # Movement tolerance threshold (in blocks squared)
  move-tolerance-squared: 0.05
  
  # Default state for new players receiving TPA requests
  allow-toggle-default: true
  
  # Permission to bypass the warmup delay
  bypass-warmup-permission: "clarityessentials.tpa.bypasswarmup"

# Home system settings (/home, /sethome, /delhome)
# Rendered entirely with Paper Native Dialog API
homes:
  enabled: true
  
  # Default home limit for players without specific permission
  default-limit: 3
  
  # Permission for unlimited homes: clarityessentials.homes.unlimited
  unlimited-permission: "clarityessentials.homes.unlimited"
  
  # Permission-based home limits: clarityessentials.homes.<key>
  # Highest matched limit will be applied.
  limits:
    vip: 5
    mvp: 10
    elite: 20
    sponsor: 50

# Sound effects (Bukkit Sound Names)
sounds:
  enabled: true
  teleport-warmup: "entity.experience_orb.pickup"
  teleport-success: "entity.enderman.teleport"
  teleport-cancel: "block.note_block.bass"
  dialog-open: "ui.button.click"
  action-success: "entity.player.levelup"
  action-failure: "block.note_block.bass"

# ESC (Pause Menu) Custom Button & Native Dialog Menu (Referencing Donut SMP)
# Minecraft syncs dialog registry data and tags during player login.
# A full server restart and client reconnect is required when changing these settings.
esc-menu:
  enabled: true
  button-text: "Clarity Menu"
  dialog-title: "Clarity Menu"
  columns: 2
  webstore-url: "https://store.clarity-id.net"
  commands:
    rtp: "rtp"
    auction: "ah"
    stats: "stats"
    skills: "skills"

# Fly System Settings (/fly)
fly:
  enabled: true
  # Default duration when none specified and player lacks unlimited perm ("unlimited", "30m", "1h", etc.)
  default-duration: "unlimited"
  # World restriction mode: BLACKLIST, WHITELIST, or DISABLED
  world-mode: "BLACKLIST"
  worlds:
    - "world_nether"
    - "world_the_end"
  # WorldGuard region restriction mode: BLACKLIST, WHITELIST, or DISABLED
  region-mode: "BLACKLIST"
  regions:
    - "pvp_arena"
    - "warzone"
    - "spawn"
  # Fall damage protection duration in seconds after flight expires or is disabled
  fall-protection-seconds: 15

# AFK System Settings (/afk)
afk:
  enabled: true
  # Automatically cancel AFK status when player moves
  auto-unafk-on-move: true
  # Automatically cancel AFK status when player sends a chat message
  auto-unafk-on-chat: true

# Custom Join & Leave Messages
join-leave:
  enabled: true
  # Default messages shown to everyone
  default-join: "<dark_gray>[<green>+</green>]</dark_gray> <white><player></white> <gray>joined the game.</gray>"
  default-leave: "<dark_gray>[<red>-</red>]</dark_gray> <white><player></white> <gray>left the game.</gray>"
  # VIP join messages checked in order from top to bottom (first matching permission is used)
  vip-join:
    owner:
      permission: "clarityessentials.join.owner"
      message: "<gold>★ <bold>[Owner]</bold> <gradient:#ff5555:#ffaa00><player></gradient> has joined the game! ★</gold>"
    admin:
      permission: "clarityessentials.join.admin"
      message: "<red>★ <bold>[Admin]</bold> <red><player></red> has joined the game! ★</red>"
    vip:
      permission: "clarityessentials.join.vip"
      message: "<yellow>★ <gold>[VIP]</gold> <yellow><player></yellow> joined the server! ★</yellow>"

# Settings commands executed by buttons
settings:
  commands:
    pvp: "pvp"
    scoreboard: "sb toggle"

# Spawn System
spawn:
  enabled: true
  # Whether players should respawn at default spawn on death
  respawn-at-spawn: true
  # If true, overrides bed and respawn anchor spawns as well
  respawn-override-bed: false
  # Teleport player to first-join spawn (or default spawn) on first join
  teleport-on-first-join: true
  # Teleport player to default spawn on every join
  teleport-on-join: false

# Mail System
mail:
  enabled: true
  # Notify player of unread mails upon joining the server
  notify-on-join: true

# JoinDialog & Changelog System (Paper Native Dialog API)
join-dialog:
  enabled: true
  # Update ID: Bump this string (e.g. v1.0.1) when releasing new updates so players who clicked "Don't remind again" will see the new update
  current-update-id: "v1.0.0"
  # Show the changelog dialog once a day when players join
  daily-reminder: true

  # First Join Tips dialog (shown only once to first-time players)
  first-join-tips:
    enabled: true
    title: "<gradient:#00fbff:#0077ff><bold>Welcome to Clarity Network!</bold></gradient>"
    body:
      - "<yellow>★ <bold>Beginner Tips & Guidelines:</bold></yellow>"
      - "<gray>1. Use <white>/menu</white> or press <white>ESC</white> to open the Central Dashboard.</gray>"
      - "<gray>2. Teleport into the wilderness using <white>/rtp</white> to build your base.</gray>"
      - "<gray>3. Set a home using <white>/sethome <name></white> so you can easily return.</gray>"
      - "<gray>4. Protect your land and trade with others using <white>/ah</white> and <white>/pay</white>.</gray>"
      - "<gray>5. Need help? Contact our staff or join our community Discord!</gray>"

  # Changelog Dialog (shown via daily reminder or manual /update, /changelog)
  changelog:
    title: "<gradient:#ffaa00:#ff5555><bold>Server Updates & Changelog</bold></gradient>"
    body:
      - "<gold><bold>What's New in Clarity Network:</bold></gold>"
      - "<gray>• Added <white>/spawn</white> with dedicated new player first-join spawn point.</gray>"
      - "<gray>• Added <white>/mail</white> system for persistent inboxes & announcements.</gray>"
      - "<gray>• Added <white>/speed</white> command to adjust walking and flight speed.</gray>"
      - "<gray>• Added <white>/fly</white>, <white>/feed</white>, <white>/heal</white>, and <white>/afk</white> with custom reasons.</gray>"
      - "<gray>• Added fast gamemode shortcuts: <white>/gmc</white>, <white>/gms</white>, <white>/gmsp</white>, <white>/gma</white>.</gray>"
      - "<gray>• Dashboard updated with <white>Skills</white> and official <white>Webstore</white>!</gray>"



