    tptoggle: "<gray><yellow>/tptoggle</yellow> <dark_gray>-</dark_gray> <white>Toggle incoming teleport requests</white></gray>"
    home: "<gray><yellow>/home [name]</yellow> <dark_gray>-</dark_gray> <white>Open Home Dialog or teleport to a home</white></gray>"
