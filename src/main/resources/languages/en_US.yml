    delhome: "<gray><yellow>/delhome [name]</yellow> <dark_gray>-</dark_gray> <white>Delete a saved home</white></gray>"
    reload: "<gray><yellow>/ce reload</yellow> <dark_gray>-</dark_gray> <white>Reload plugin configuration and data</white></gray>"

