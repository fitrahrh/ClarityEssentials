    header: "<white><bold>=== ClarityEssentials Commands ===</bold></white>"
    menu: "<gray><yellow>/menu</yellow> <dark_gray>-</dark_gray> <white>Open Centralized Player Dashboard</white></gray>"
    nick: "<gray><yellow>/nick <name|reset></yellow> <dark_gray>-</dark_gray> <white>Set or reset your nickname</white></gray>"
    realname: "<gray><yellow>/realname <nick></yellow> <dark_gray>-</dark_gray> <white>Lookup real username from nickname</white></gray>"
    tpa: "<gray><yellow>/tpa <player></yellow> <dark_gray>-</dark_gray> <white>Request teleport to a player</white></gray>"
    tpahere: "<gray><yellow>/tpahere <player></yellow> <dark_gray>-</dark_gray> <white>Request a player to teleport to you</white></gray>"
    tpaccept: "<gray><yellow>/tpaccept [player]</yellow> <dark_gray>-</dark_gray> <white>Accept a teleport request</white></gray>"
